services:
  nibchat:
    image: docker.io/sandmor/nibchat:nightly
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    env_file:
      - .env
    environment:
      SQLITE_PATH: /data/nibchat.db
      # Empty → SQLite. For Postgres profile set in .env:
      # DATABASE_URL=postgres://nibchat:nibchat@postgres:5432/nibchat
      DATABASE_URL: ${DATABASE_URL:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      MCP_RUNTIME_MODE: ${MCP_RUNTIME_MODE:-stateful}
      GENERATION_RUNTIME_MODE: ${GENERATION_RUNTIME_MODE:-stateful}
      GENERATION_STREAM_BACKEND: ${GENERATION_STREAM_BACKEND:-memory}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_TOKEN: ${REDIS_TOKEN:-}
      ATTACHMENT_STORAGE: ${ATTACHMENT_STORAGE:-filesystem}
      ATTACHMENT_FILESYSTEM_PATH: ${ATTACHMENT_FILESYSTEM_PATH:-/data/attachments}
    volumes:
      - ./data:/data
    depends_on:
      postgres:
        condition: service_healthy
        required: false
  postgres:
    image: postgres:18-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: nibchat
      POSTGRES_USER: nibchat
      POSTGRES_PASSWORD: nibchat
    volumes: ["nibchat-postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nibchat -d nibchat"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    profiles: ["redis"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  nibchat-postgres:
